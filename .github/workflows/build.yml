name: Build site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@v5

      - name: Install Hugo
        run: |
          curl -sSLo hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/

      # Two trees. site/public/ is served to anyone; site/public-members/ is
      # copied outside the public web root and read only after a login. Neither
      # build passes --gc: the checkout is fresh so there is nothing to collect,
      # and the two builds share one resource cache, where a collecting pass
      # deletes the cached image variants belonging to the other one.
      - name: Build the public tree
        working-directory: site
        run: hugo --minify --cleanDestinationDir

      - name: Build the member tree
        working-directory: site
        run: hugo --minify --cleanDestinationDir --environment members

      - name: Check no member page reaches the public tree
        working-directory: site
        run: ./check-trees.sh

      - uses: actions/upload-artifact@v5
        with:
          name: site-public
          path: site/public/
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: site-members
          path: site/public-members/
          if-no-files-found: error
