name: Proxy

on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/proxy.yml"
      - ".github/known_hosts"
  pull_request:
    paths:
      - "proxy/**"
      - ".github/workflows/proxy.yml"
      - ".github/known_hosts"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The module root is proxy/, not the repository root, so every Go command
    # has to run from there.
    defaults:
      run:
        working-directory: proxy
    env:
      # proxy/go.mod declares the 1.27 line; this is the patch release the
      # module is developed against. The Dockerfile pins golang:1.27-bookworm
      # for the image build, so the two have to move together.
      GO_VERSION: "1.27.1"
      # Without this the go directive in proxy/go.mod silently outranks the
      # version above, which makes GO_VERSION a floor rather than a pin. With
      # it, a module that outgrows the pinned toolchain fails here instead of
      # quietly testing against a different one.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # working-directory above does not reach an action, and the checksum
          # file is not where setup-go looks by default.
          cache-dependency-path: proxy/go.sum

      # gofmt -l prints the offending files and still exits 0, so the exit code
      # has to be built by hand. Without both halves of this the step is green
      # whatever it finds: `|| exit 1` covers the file it could not parse, on
      # which it prints nothing to stdout, and the -n test covers the rest.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .) || exit 1
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      # go test already runs a small set of analysers. Vet adds the rest, two of
      # which cover things this service does on every request: contexts whose
      # cancel is never called, and HTTP responses touched before the error is
      # checked. Both compile and both pass the tests.
      - name: Vet
        run: go vet ./...

      # The capture tests photograph a real page when they find a browser, and
      # the runner image ships full Google Chrome — the one browser the server
      # never runs, and one that spends the capture timeout retrying D-Bus and
      # Google services a runner does not have. Testing the browser the image
      # actually ships means putting it on PATH here; the preview package
      # prefers it over the runner's Chrome once it is there. The version and
      # checksum are read out of Dockerfile.mcp so the pin lives in one place.
      - name: Install chrome-headless-shell
        run: |
          version=$(sed -n 's/^ARG CHROMIUM_VERSION=//p' Dockerfile.mcp)
          sha256=$(sed -n 's/^ARG CHROMIUM_SHA256=//p' Dockerfile.mcp)
          curl -sSLo "$RUNNER_TEMP/chromium.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-headless-shell-linux64.zip"
          echo "${sha256}  $RUNNER_TEMP/chromium.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chromium.zip" -d "$RUNNER_TEMP/chromium"
          echo "$RUNNER_TEMP/chromium/chrome-headless-shell-linux64" >> "$GITHUB_PATH"

      # This compiles every package and its tests, so there is no separate
      # build step. -race, and only -race, because sessions and half-finished
      # sign-ins are shared maps read by concurrent handlers; a race there
      # hands one editor another's session.
      - name: Test
        run: go test -race ./...

      # The image is how this service ships and nothing above looks at the
      # Dockerfile. DOCKER_BUILDKIT=0 on purpose: DEV.md requires the file to
      # stay buildable by the legacy builder for rootless Docker, and building
      # it that way here is what keeps BuildKit-only syntax out. Nothing is
      # pushed; the build failing is the whole result.
      - name: Build the image
        run: DOCKER_BUILDKIT=0 docker build -t cms-auth-proxy:ci .

  # Pushes the image to the registry prodeko-vm2 pulls from, then asks the VM
  # to deploy it. A registry rather than the streamed tarball the site uses,
  # because a compiled service in a container has a natural place to live and
  # because ilmo and prodeko-org already ship this way; see
  # ansible/roles/cms_auth_proxy in the infra-prodeko repository, which owns
  # everything on the far side of the SSH command below.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment, not the if: above, is the load-bearing part. Fork pull
    # requests never get secrets, but same-repo branch pull requests do. An
    # environment whose deployment branch policy allows only main turns branch
    # protection into credential protection.
    environment: production
    # Queue rather than cancel. Two deploys racing would have the VM pull two
    # tags and the one that finishes last wins, which need not be the newer
    # commit.
    concurrency:
      group: deploy-cms-auth-proxy
      cancel-in-progress: false
    env:
      REGISTRY: prodekoregistry.azurecr.io
      IMAGE: prodekoregistry.azurecr.io/cms-auth-proxy
      # The ACR admin user. Not a secret, and the same name the VM logs in
      # with; its password is the Key Vault secret acr-admin-password.
      REGISTRY_USERNAME: prodekoregistry
    steps:
      - uses: actions/checkout@v5

      - name: Log in to the container registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      # Two tags for one image. sha-<40 hex> is what the deploy asks for and
      # what .image-tag on the VM records, so a rollback names an exact build.
      # main is the floating pointer deploy.sh falls back to when the host has
      # never deployed before and has no .image-tag to read.
      #
      # DOCKER_BUILDKIT=0 matches the check job above: the image that ships is
      # built by the same builder that proved the Dockerfile stays free of
      # BuildKit-only syntax.
      - name: Build and push the image
        working-directory: proxy
        env:
          SHA: ${{ github.sha }}
        run: |
          DOCKER_BUILDKIT=0 docker build \
            -t "$IMAGE:sha-$SHA" \
            -t "$IMAGE:main" \
            .
          docker push "$IMAGE:sha-$SHA"
          docker push "$IMAGE:main"

      # Plain openssh-client from the runner image, no marketplace action, for
      # the reasons set out at length in build.yml. The host key is committed
      # to .github/known_hosts and the SSH target is the apex, so a future VM
      # move fails closed on the pin instead of deploying to the wrong host.
      #
      # The command is the only one the deploy key is allowed to run: sshd
      # forces ssh-deploy-wrapper.sh, whose regex accepts this line and
      # nothing else.
      - name: Deploy on prodeko-vm2
        env:
          DEPLOY_KEY: ${{ secrets.CMS_AUTH_PROXY_DEPLOY_KEY }}
          SHA: ${{ github.sha }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=.github/known_hosts \
            deploy-cms-auth-proxy@prodeko.org \
            "IMAGE_TAG=sha-$SHA /srv/www/cms-auth-proxy/deploy.sh"
