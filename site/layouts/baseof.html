<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }} — {{ if eq .Language.Lang "fi" }}Tuotantotalouden kilta{{ else }}The IEM guild at Aalto University{{ end }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ with .Description }}<meta name="description" content="{{ . }}" />{{ end }}
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main id="main" data-pagefind-body>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ with resources.Get "js/mega-menu.js" }}
      {{ $js := . | minify | fingerprint }}
      <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
    {{ end }}
  </body>
</html>
