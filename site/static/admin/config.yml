# The editing screen at prodeko.org/admin.
#
# Four collections: public pages and member-only pages, Finnish and English.
# Labels are Finnish because the editors are; Decap ships no Finnish locale, so
# the chrome around them is English.
#
# YAML anchors (&name) and merge keys (<<:) are used to write the fields that
# are identical in all four collections once. Decap parses the file with merge
# keys enabled, so an alias (*name) is the same field definition repeated.

backend:
  name: github
  repo: prodeko/prodeko-hack
  branch: main

  # The editor login proxy, not GitHub. base_url must be a bare origin: Decap
  # compares the login popup's postMessage origin against this string exactly,
  # and a trailing slash or a path makes the login hang with no error.
  # See proxy/README.md.
  base_url: https://cms.prodeko.org
  auth_endpoint: auth
  api_root: https://cms.prodeko.org/github

  # The commit status .github/workflows/preview.yml posts with the address of
  # this entry's pull request preview. Decap resolves the entry's cms/ branch
  # to its pull request, reads GET /commits/{head.sha}/status, and shows the
  # link on the entry.
  #
  # This must be set. Unset, Decap matches any status context containing the
  # substring "deploy", and "prodeko/preview" does not, so the link never
  # appears and nothing says why. With it set the match is exact, so this
  # string and the workflow's context field are one value in two files.
  preview_context: prodeko/preview

# There is no local_backend key here on purpose, and there must never be one.
# Decap's local backend bypasses the proxy entirely, so testing with it
# exercises none of the login path while appearing to work.

# Saving opens a pull request on a cms/ branch instead of writing main. The
# proxy's allowlist assumes this: it permits ref writes only under refs/heads/cms/*.
publish_mode: editorial_workflow

locale: fi

# Page addresses are ASCII on the current site (arvot, poytakirjat), so
# transliterate rather than putting ä and ö into filenames and URLs.
slug:
  encoding: ascii
  clean_accents: true

# Hugo copies site/static/ to the root of the built site, so an image saved
# here is served at /uploads/<name> from both the public and the member tree.
# Member-page images are therefore public; nothing member-only belongs in a
# picture until the member tree has a gated media path of its own.
media_folder: site/static/uploads
public_folder: /uploads

# No preview pane. The visual design lives in the templates and is being built
# separately; a preview that does not look like the site misleads the editor.
editor:
  preview: false

collections:
  - name: pages_fi
    label: "Sivut (suomeksi)"
    label_singular: "Sivu"
    description: >-
      Julkiset suomenkieliset sivut. Tiedoston polku on sivun osoite:
      kilta/arvot on prodeko.org/fi/kilta/arvot/.
    folder: site/content/fi
    create: true
    extension: md
    format: frontmatter
    # depth covers content/fi/a/b/c/d.md. subfolders: false tells the listing
    # that a page is a file in a folder, not a folder with an index file in it,
    # which is how this repository is laid out.
    nested:
      depth: 4
      subfolders: false
    # Where this entry lands in the built site, appended to the preview address
    # from the commit status. {{dirname}} is the path under folder: above and
    # keeps its slashes; {{slug}} would be run through the slug sanitiser and
    # come back with them replaced, which is why it is not used here.
    #
    # A page at the top of the folder has an empty {{dirname}} and so a doubled
    # slash, which Caddy resolves to the same page. A section's own _index.md
    # previews one level too deep, at the section address plus "_index/"; those
    # pages are edited rarely and the cure is a files collection, not a second
    # template.
    #
    # Nothing in this file may spell a member section path. Hugo copies
    # site/static/ into the public tree, and check-trees.sh fails the build if
    # the public tree so much as names one.
    preview_path: "fi/{{dirname}}/{{filename}}/"
    sortable_fields: [title, reviewed]
    fields:
      - &title
        label: "Otsikko"
        name: title
        widget: string

      # The Finnish page owns the key. Lower case, no spaces, and it never
      # changes once the English page points at it.
      - label: "Käännösavain"
        name: translationKey
        widget: string
        pattern:
          ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Pieniä kirjaimia, numeroita ja väliviivoja.']
        hint: >-
          Yhdistää tämän sivun englanninkieliseen vastineeseensa. Englanninkielistä
          sivua tehdessä avain valitaan listasta, joten tämä on ainoa paikka jossa
          se kirjoitetaan. Älä muuta olemassa olevaa avainta.

      - &reviewed
        label: "Tarkistettu"
        name: reviewed
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        hint: "Päivä jona sisältö on viimeksi tarkistettu ajantasaiseksi."

      - &owner
        label: "Vastuurooli"
        name: owner
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Pieniä kirjaimia ja väliviivoja, esimerkiksi hallitus.']
        hint: "Killan rooli joka vastaa tästä sivusta, esimerkiksi hallitus tai webbitiimi."

      - &body
        label: "Sisältö"
        name: body
        widget: markdown
        required: false
        hint: >-
          Prodekon palvelut lisätään Lisää-valikosta (ilmo, kuvagalleria,
          verkkokauppa, viikkotiedote, vaalit) eikä kirjoittamalla HTML:ää.

  - name: pages_en
    label: "Sivut (englanniksi)"
    label_singular: "Sivu"
    description: >-
      Julkiset englanninkieliset sivut. Tee suomenkielinen sivu ensin:
      käännösavain valitaan suomenkielisten sivujen listasta.
    folder: site/content/en
    create: true
    extension: md
    format: frontmatter
    nested:
      depth: 4
      subfolders: false
    # See pages_fi. The language prefix is the only difference.
    preview_path: "en/{{dirname}}/{{filename}}/"
    sortable_fields: [title, reviewed]
    fields:
      - *title

      # Picked from the Finnish pages rather than typed. A mistyped key does
      # not fail a build; it silently unpairs the two pages and the language
      # switch on the live site leads to a 404.
      - label: "Käännösavain"
        name: translationKey
        widget: relation
        collection: pages_fi
        value_field: translationKey
        search_fields: [title, translationKey]
        display_fields: [title, translationKey]
        hint: "Valitse suomenkielinen sivu jonka käännös tämä on."

      - *reviewed
      - *owner
      - *body

  - name: member_pages_fi
    label: "VAIN JÄSENILLE – Sivut (suomeksi)"
    label_singular: "Jäsensivu"
    description: >-
      VAIN JÄSENILLE. Näitä sivuja ei julkaista avoimeen verkkoon lainkaan, vaan
      ne näkyvät ainoastaan Prodeko-tunnuksella kirjautuneille. Julkinen sivu ei
      kuulu tänne: kukaan ulkopuolinen ei löydä sitä.
    folder: site/content-members/fi
    create: true
    extension: md
    format: frontmatter
    nested:
      depth: 4
      subfolders: false
    # See pages_fi.
    preview_path: "fi/{{dirname}}/{{filename}}/"
    sortable_fields: [title, reviewed]
    fields:
      - *title
      - label: "Käännösavain"
        name: translationKey
        widget: string
        pattern:
          ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Pieniä kirjaimia, numeroita ja väliviivoja.']
        hint: "Yhdistää tämän sivun englanninkieliseen vastineeseensa."
      - *reviewed
      - *owner
      - *body

  # Five fixed pages (the front page plus the Guild, Prospective students,
  # Corporate relations and Alumni hubs) built from the raw-website/ design
  # export. Unlike pages_fi/pages_en above, these are not an open collection
  # an editor can add to - each is a specific file with its own field shape,
  # matching one of site/layouts/{home,guild-hub,prospective-hub,
  # corporate-hub,alumni-hub}.html. A `files` collection is Decap's way to
  # edit a fixed set of files rather than an open folder of them.
  #
  # Each file carries its own preview_path, which Decap prefers over a
  # collection-level one. They are literal addresses rather than templates,
  # because a section index is at the directory's own URL and no arrangement of
  # {{dirname}} and {{filename}} produces that from an _index.md.
  - name: special_pages
    label: "Erikoissivut"
    label_singular: "Erikoissivu"
    description: >-
      Etusivu ja neljä pääsivua. Näiden ulkoasu tulee malleista (layouts/),
      ei tästä lomakkeesta - täällä muokataan vain niiden tekstisisältöä.
    files:
      - name: home_fi
        label: "Etusivu (suomeksi)"
        file: site/content/fi/_index.md
        preview_path: "fi/"
        fields: &homeFields
          - *title
          - name: layout
            widget: hidden
            required: false
          - name: source
            widget: hidden
            required: false
          - label: "Käännösavain"
            name: translationKey
            widget: string
          - label: "Yläotsikko (hero)"
            name: heroKicker
            widget: string
          - label: "Otsikko (hero)"
            name: heroTitle
            widget: string
          - label: "\"Hae jäseneksi\" -painike: teksti"
            name: ctaJoin
            widget: string
          - label: "\"Hae jäseneksi\" -painike: osoite"
            name: ctaJoinUrl
            widget: string
          - label: "\"Yrityksille\" -painike: teksti"
            name: ctaCompanies
            widget: string
          - label: "\"Yrityksille\" -painike: osoite"
            name: ctaCompaniesUrl
            widget: string
          - label: "Ajankohtaista-nosto"
            name: announcement
            widget: object
            fields:
              - {label: "Yläotsikko", name: kicker, widget: string}
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
              - {label: "Linkin teksti", name: linkText, widget: string}
          - label: "Kohderyhmäkortit"
            name: audiences
            widget: list
            summary: "{{title}}"
            fields:
              - {label: "Yläotsikko", name: kicker, widget: string}
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
              - {label: "Linkin teksti", name: linkText, widget: string}
              - {label: "Osoite", name: url, widget: string}
          - label: "Arvot-osion otsikko"
            name: valuesTitle
            widget: string
          - label: "Arvot-osion alaotsikko"
            name: valuesSub
            widget: string
          - label: "Arvot"
            name: values
            widget: list
            summary: "{{name}}"
            hint: >-
              Kuva haetaan nimen perusteella (esim. "Think big" ->
              assets/images/values/arvo-think-big.jpg). Kuvaa ei ladata tästä.
            fields:
              - {label: "Nimi", name: name, widget: string}
          - label: "Kuvapalkin otsikko"
            name: bandTitle
            widget: string
          - label: "Kuvapalkin teksti"
            name: bandSub
            widget: string
          - label: "Yhteistyö-osion otsikko"
            name: partnersTitle
            widget: string
          - label: "Yhteistyö-osion linkin teksti"
            name: partnersLinkText
            widget: string
          - label: "Yhteistyö-osion linkin osoite"
            name: partnersLinkUrl
            widget: string
          - label: "Hero-teksti (leipäteksti)"
            name: body
            widget: markdown
            required: false

      - name: home_en
        label: "Etusivu (englanniksi)"
        file: site/content/en/_index.md
        preview_path: "en/"
        fields: *homeFields

      - name: guild_hub_fi
        label: "Kilta-sivu (suomeksi)"
        file: site/content/fi/guild/_index.md
        preview_path: "fi/guild/"
        fields: &guildHubFields
          - *title
          - {name: layout, widget: hidden, required: false}
          - {name: source, widget: hidden, required: false}
          - {label: "Käännösavain", name: translationKey, widget: string}
          - {label: "Yläotsikko", name: guildKicker, widget: string}
          - {label: "Otsikko", name: guildTitle, widget: string}
          - label: "Tunnusluvut"
            name: numbers
            widget: list
            summary: "{{value}} — {{label}}"
            fields:
              - {label: "Arvo", name: value, widget: string}
              - {label: "Selite", name: label, widget: string}
          - label: "Osiot"
            name: sections
            widget: list
            summary: "{{title}}"
            fields:
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
              - label: "Kortit"
                name: items
                widget: list
                summary: "{{name}}"
                fields:
                  - {label: "Nimi", name: name, widget: string}
                  - {label: "Kuvaus", name: desc, widget: text}
          - {label: "Kiltahuone-otsikko", name: guildRoomTitle, widget: string}
          - {label: "Kiltahuone-teksti", name: guildRoomBody, widget: text}
          - {label: "Asiakirjat-otsikko", name: docsTitle, widget: string}
          - label: "Asiakirjat (linkkien nimet)"
            name: docs
            widget: list
          - {label: "Yhteystiedot-otsikko", name: contactTitle, widget: string}
          - label: "Osoite"
            name: contactAddress
            widget: text
            hint: "Yksi rivi per rivinvaihto, esim. katuosoite omalla rivillään."
          - label: "Ingressi"
            name: body
            widget: markdown
            required: false

      - name: guild_hub_en
        label: "Guild page (English)"
        file: site/content/en/guild/_index.md
        preview_path: "en/guild/"
        fields: *guildHubFields

      - name: prospective_hub_fi
        label: "Abeille-sivu (suomeksi)"
        file: site/content/fi/abit/_index.md
        preview_path: "fi/abit/"
        fields: &prospectiveHubFields
          - *title
          - {name: layout, widget: hidden, required: false}
          - {name: source, widget: hidden, required: false}
          - {label: "Käännösavain", name: translationKey, widget: string}
          - {label: "Yläotsikko", name: prospKicker, widget: string}
          - {label: "Otsikko", name: prospTitle, widget: string}
          - {label: "\"Opinnot\"-otsikko", name: whatTitle, widget: string}
          - {label: "\"Opinnot\", 1. kappale", name: whatBody1, widget: text}
          - {label: "\"Opinnot\", 2. kappale", name: whatBody2, widget: text}
          - {label: "Hakeminen-otsikko", name: applyTitle, widget: string}
          - label: "Hakemisen vaiheet"
            name: applySteps
            widget: list
            summary: "{{n}}. {{title}}"
            fields:
              - {label: "Numero", name: n, widget: string}
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
          - {label: "Opiskelijaelämä-otsikko", name: lifeTitle, widget: string}
          - label: "Opiskelijaelämä-kortit"
            name: life
            widget: list
            summary: "{{title}}"
            fields:
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
          - {label: "UKK-otsikko", name: faqTitle, widget: string}
          - label: "Usein kysytyt kysymykset"
            name: faq
            widget: list
            summary: "{{q}}"
            fields:
              - {label: "Kysymys", name: q, widget: string}
              - {label: "Vastaus", name: a, widget: text}
          - {label: "Abivastaavat-yläotsikko", name: captainsKicker, widget: string}
          - {label: "Abivastaavat-otsikko", name: captainsTitle, widget: string}
          - {label: "Abivastaavat-teksti", name: captainsBody, widget: text}
          - {label: "Abivastaavat-sähköposti", name: captainsEmail, widget: string}
          - label: "Ingressi"
            name: body
            widget: markdown
            required: false

      - name: prospective_hub_en
        label: "Prospective students page (English)"
        file: site/content/en/prospective-students.md
        preview_path: "en/prospective-students/"
        fields: *prospectiveHubFields

      - name: corporate_hub_fi
        label: "Yrityksille-sivu (suomeksi)"
        file: site/content/fi/yrityssuhteet/_index.md
        preview_path: "fi/yrityssuhteet/"
        fields: &corporateHubFields
          - *title
          - {name: layout, widget: hidden, required: false}
          - {name: source, widget: hidden, required: false}
          - {label: "Käännösavain", name: translationKey, widget: string}
          - {label: "Yläotsikko", name: corpKicker, widget: string}
          - {label: "Otsikko", name: corpTitle, widget: string}
          - {label: "Yhteydenotto-painikkeen teksti", name: corpCta, widget: string}
          - {label: "Yhteydenoton sähköposti", name: corpContactEmail, widget: string}
          - label: "Tunnusluvut"
            name: corpNumbers
            widget: list
            summary: "{{value}} — {{label}}"
            fields:
              - {label: "Arvo", name: value, widget: string}
              - {label: "Selite", name: label, widget: string}
          - {label: "Yhteistyö-otsikko (sivupalkki)", name: partnersTitle, widget: string}
          - {label: "Yhteystiedot-otsikko", name: contactTitle, widget: string}
          - {label: "Yhteistyömuodot-otsikko", name: offerTitle, widget: string}
          - label: "Yhteistyömuodot"
            name: offers
            widget: list
            summary: "{{title}}"
            fields:
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
          - {label: "Yhteyshenkilön rooli", name: corpContactName, widget: string}
          - {label: "Yhteyshenkilön kausi", name: corpContactRole, widget: string}
          - {label: "Yhteyshenkilön teksti", name: corpContactBody, widget: text}
          - label: "Ingressi"
            name: body
            widget: markdown
            required: false

      - name: corporate_hub_en
        label: "Companies page (English)"
        file: site/content/en/yrityssuhteet/_index.md
        preview_path: "en/yrityssuhteet/"
        fields: *corporateHubFields

      - name: alumni_hub_fi
        label: "Alumni-sivu (suomeksi)"
        file: site/content/fi/alumni/_index.md
        preview_path: "fi/alumni/"
        fields: &alumniHubFields
          - *title
          - {name: layout, widget: hidden, required: false}
          - {name: source, widget: hidden, required: false}
          - {label: "Käännösavain", name: translationKey, widget: string}
          - {label: "Yläotsikko", name: alumniKicker, widget: string}
          - {label: "Otsikko", name: alumniTitle, widget: string}
          - label: "Tunnusluvut"
            name: alumniNumbers
            widget: list
            summary: "{{value}} — {{label}}"
            fields:
              - {label: "Arvo", name: value, widget: string}
              - {label: "Selite", name: label, widget: string}
          - label: "Osiot"
            name: sections
            widget: list
            summary: "{{title}}"
            fields:
              - {label: "Otsikko", name: title, widget: string}
              - {label: "Teksti", name: body, widget: text}
          - {label: "Liity-nosto: yläotsikko", name: alumniJoinKicker, widget: string}
          - {label: "Liity-nosto: otsikko", name: alumniJoinTitle, widget: string}
          - {label: "Liity-nosto: teksti", name: alumniJoinBody, widget: text}
          - {label: "Liity-nosto: sähköposti", name: alumniJoinEmail, widget: string}
          - {label: "Linkkilistan otsikko", name: alumniLinksTitle, widget: string}
          - label: "Linkkilista (nimet)"
            name: alumniLinks
            widget: list
          - {label: "Yhteystiedot-otsikko", name: contactTitle, widget: string}
          - label: "Osoite"
            name: contactAddress
            widget: text
            hint: "Yksi rivi per rivinvaihto."
          - label: "Ingressi"
            name: body
            widget: markdown
            required: false

      - name: alumni_hub_en
        label: "Alumni page (English)"
        file: site/content/en/alumni/_index.md
        preview_path: "en/alumni/"
        fields: *alumniHubFields

  - name: member_pages_en
    label: "VAIN JÄSENILLE – Sivut (englanniksi)"
    label_singular: "Jäsensivu"
    description: >-
      VAIN JÄSENILLE. Näitä sivuja ei julkaista avoimeen verkkoon lainkaan.
      Tee suomenkielinen jäsensivu ensin.
    folder: site/content-members/en
    create: true
    extension: md
    format: frontmatter
    nested:
      depth: 4
      subfolders: false
    # See pages_fi. The language prefix is the only difference.
    preview_path: "en/{{dirname}}/{{filename}}/"
    sortable_fields: [title, reviewed]
    fields:
      - *title
      - label: "Käännösavain"
        name: translationKey
        widget: relation
        collection: member_pages_fi
        value_field: translationKey
        search_fields: [title, translationKey]
        display_fields: [title, translationKey]
        hint: "Valitse suomenkielinen jäsensivu jonka käännös tämä on."
      - *reviewed
      - *owner
      - *body
